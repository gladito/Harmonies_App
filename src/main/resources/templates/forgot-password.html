<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{forgot.pageTitle}">Harmony · Recuperar contraseña</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Montserrat', Arial, sans-serif;
            background: #080808;
            color: #f8f8ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .card {
            background-color: #121212;
            border: 1px solid #8b7324;
            border-top: 3px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
            padding: 38px 34px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        .card h1 {
            margin: 0 0 10px;
            font-size: 26px;
            color: #d4af37;
            text-align: center;
            font-family: Georgia, serif;
        }
        .card p.subtitle {
            margin: 0 0 22px;
            color: #cccccc;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }
        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .alert.error {
            background-color: rgba(248, 113, 113, 0.16);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fecaca;
        }
        .alert.success {
            background-color: rgba(212, 175, 55, 0.14);
            border: 1px solid #d4af37;
            color: #f8e8a6;
        }
        .verified-box {
            background: #19160c;
            border: 1px solid #8b7324;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 18px;
            font-size: 13.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .verified-box strong {
            color: #d4af37;
        }
        label {
            display: block;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #666;
            background: #080808;
            color: #f8f8ff;
            font-size: 15px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #d4af37;
            outline: none;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }
        button {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            background: #d4af37;
            color: #080808;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
        }
        button:hover {
            background: #e5c349;
            transform: translateY(-1px);
        }
        .footer-links {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }
        .footer-links a, .verified-box a {
            color: #d4af37;
            font-weight: 600;
            text-decoration: none;
        }
        .footer-links a:hover, .verified-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="#{forgot.heading}">Recuperar contraseña</h1>

    <!-- Subtítulo dinámico según Paso 1 (Verificar Email) o Paso 2 (Cambiar Contraseña) -->
    <p class="subtitle" th:if="${verifiedEmail == null}" th:text="#{forgot.step1Subtitle}">
        Paso 1 de 2: Ingresá el email asociado a tu cuenta para verificar tu identidad.
    </p>
    <p class="subtitle" th:if="${verifiedEmail != null}" th:text="#{forgot.step2Subtitle}">
        Paso 2 de 2: Tu email fue verificado. Definí tu nueva contraseña segura.
    </p>

    <div th:if="${forgotError}" class="alert error" role="alert" th:text="${forgotError}"></div>
    <div th:if="${forgotSuccess}" class="alert success" role="status" th:text="${forgotSuccess}"></div>

    <!-- PASO 1: Formulario para ingresar y validar el email de la cuenta -->
    <form th:if="${verifiedEmail == null}" th:action="@{/forgot-password/verify}" method="post">
        <label for="email" th:text="#{forgot.emailLabel}">Email asociado a la cuenta</label>
        <input id="email" name="email" type="email" placeholder="nombre@ejemplo.com" required autofocus>
        <button type="submit" th:text="#{forgot.verifyButton}">Verificar email</button>
    </form>

    <!-- PASO 2: Recién cuando el email fue validado, se habilita el cambio de contraseña -->
    <div th:if="${verifiedEmail != null}">
        <div class="verified-box">
            <div>
                <span th:text="#{forgot.verifiedBadge}">Cuenta verificada:</span>
                <strong th:text="|@${verifiedUsername} (${verifiedEmail})|"></strong>
            </div>
            <a th:href="@{/forgot-password(changeEmail=true)}" th:text="#{forgot.useAnotherEmail}">Cambiar email</a>
        </div>

        <form th:action="@{/forgot-password/reset}" method="post">
            <label for="newPassword" th:text="#{forgot.newPasswordLabel}">Nueva contraseña</label>
            <input id="newPassword" name="newPassword" type="password"
                   th:placeholder="#{forgot.passwordHint}" required autofocus>

            <label for="confirmPassword" th:text="#{forgot.confirmPasswordLabel}">Confirmar nueva contraseña</label>
            <input id="confirmPassword" name="confirmPassword" type="password"
                   th:placeholder="#{forgot.passwordHint}" required>

            <button type="submit" th:text="#{forgot.resetButton}">Actualizar contraseña</button>
        </form>
    </div>

    <div class="footer-links">
        <a th:href="@{/login}" th:text="#{forgot.backToLogin}">← Volver a Iniciar sesión</a>
    </div>
</div>
<script defer th:src="@{/js/harmony.js}"></script>
</body>
</html>
