<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{groups.editTitle}">Harmony · Editar banda</title>
    <link rel="stylesheet" th:href="@{/css/harmony.css}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main style="max-width:680px;">
    <div class="notice" role="alert" th:if="${createError}" th:text="${createError}"></div>

    <section class="card hero">
        <span class="eyebrow" th:text="#{band.eyebrow}">Una banda. Muchos sonidos.</span>
        <h1 th:text="#{groups.editHeading}">Editar banda</h1>
        <p class="muted" th:text="#{groups.editSubtitle}">Actualiza el nombre y la descripción de tu banda.</p>
    </section>

    <section class="card">
        <form th:action="@{|/groups/${groupId}/edit|}" th:object="${groupForm}" method="post" enctype="multipart/form-data">
            <div th:if="${!#strings.isEmpty(groupForm.avatarUrl)}" class="row-avatar" style="margin-bottom:16px;">
                <img class="avatar-img avatar-md" th:src="${groupForm.avatarUrl}" alt="Avatar">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                    <input type="checkbox" name="removeAvatar" value="true">
                    <span th:text="#{band.avatarRemove}">Quitar foto de la banda</span>
                </label>
            </div>

            <label for="name" th:text="#{groups.nameLabel}">Nombre de la banda</label>
            <input id="name" type="text" th:field="*{name}" maxlength="80" required>

            <label for="description" th:text="#{band.description}">Descripción</label>
            <textarea id="description" th:field="*{description}" maxlength="255"></textarea>

            <label for="avatarFile" th:text="#{band.avatarUpload}">Subir foto de la banda (PNG, JPG, WEBP, GIF)</label>
            <input id="avatarFile" type="file" name="avatarFile" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml">

            <label for="avatarUrl" th:text="#{band.avatarUrl}">O enlace de imagen (https://...)</label>
            <input id="avatarUrl" type="text" th:field="*{avatarUrl}" maxlength="255" placeholder="https://...">

            <div class="actions" style="justify-content:space-between;margin-top:10px;">
                <a class="btn" th:href="@{/groups}" th:text="#{common.cancel}">Cancelar</a>
                <button type="submit" class="active" th:text="#{common.saveChanges}">Guardar cambios</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
