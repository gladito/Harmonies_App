<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Harmony | Editar banda</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(circle at top, #1e40af 0%, #0f172a 55%, #020617 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 24px;
            padding: 36px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card h1 {
            margin: 0;
            font-size: 30px;
        }

        label {
            font-weight: 600;
            color: rgba(226, 232, 240, 0.85);
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.65);
            color: #e2e8f0;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            resize: vertical;
        }

        textarea {
            min-height: 120px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .actions a {
            text-decoration: none;
            color: #93c5fd;
            font-weight: 600;
        }

        button[type="submit"] {
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #22d3ee, #6366f1);
            color: #020617;
            font-weight: 700;
            font-size: 16px;
            padding: 12px 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px rgba(99, 102, 241, 0.35);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            background: rgba(248, 113, 113, 0.18);
            color: #fecaca;
            border: 1px solid rgba(248, 113, 113, 0.35);
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Editar banda</h1>
    <p style="margin:0;color:rgba(226,232,240,0.75);">Actualiza el nombre y la descripción de tu banda.</p>

    <div th:if="${createError}" class="alert" th:text="${createError}">Error</div>

    <form th:action="@{|/groups/${groupId}/edit|}" th:object="${groupForm}" method="post">
        <label for="name">Nombre de la banda</label>
        <input id="name" type="text" th:field="*{name}" placeholder="Nombre de la banda" required>

        <label for="description">Descripción</label>
        <textarea id="description" th:field="*{description}" maxlength="255"
                  placeholder="Describe el estilo o metas de tu banda."></textarea>

        <div class="actions">
            <a th:href="@{/groups}">Cancelar</a>
            <button type="submit">Guardar cambios</button>
        </div>
    </form>
</div>
</body>
</html>
