<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{profile.title}">Harmony · Mi perfil</title>
    <link rel="stylesheet" th:href="@{/css/harmony.css}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main style="max-width:740px;">
    <div class="notice" role="status" th:if="${profileSuccess}" th:text="${profileSuccess}"></div>
    <div class="notice" role="alert" th:if="${profileError}" th:text="${profileError}"></div>
    <div class="notice" role="status" th:if="${passwordSuccess}" th:text="${passwordSuccess}"></div>
    <div class="notice" role="alert" th:if="${passwordError}" th:text="${passwordError}"></div>

    <section class="card hero">
        <div class="hero-header">
            <img class="avatar-img avatar-lg" th:if="${!#strings.isEmpty(avatarUrl)}" th:src="${avatarUrl}" th:alt="${session.username}">
            <span class="avatar avatar-lg" th:if="${#strings.isEmpty(avatarUrl)}"
                  th:text="${session.username != null ? #strings.substring(session.username,0,1).toUpperCase() : 'U'}"></span>
            <div class="hero-header-info">
                <span class="eyebrow" th:text="#{profile.eyebrow}">Perfil de músico</span>
                <h1 th:text="#{profile.heading}">Mi perfil</h1>
                <p class="muted" th:text="${session.username}"></p>
            </div>
        </div>
    </section>

    <section class="card">
        <h2 style="margin-top:0;" th:text="#{profile.avatarHeading}">Foto de perfil</h2>
        <form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="from" value="account">
            <label for="accountAvatarFile" th:text="#{profile.avatarUpload}">Subir imagen (PNG, JPG, WEBP, GIF)</label>
            <input id="accountAvatarFile" type="file" name="avatarFile" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml">
            <label for="accountAvatarUrl" th:text="#{profile.avatarUrl}">O pegar enlace de imagen (https://...)</label>
            <input id="accountAvatarUrl" type="text" name="avatarUrl" maxlength="255" th:value="${avatarUrl}" placeholder="https://...">
            <button type="submit" class="active" th:text="#{profile.avatarSave}">Guardar foto</button>
        </form>
        <form th:if="${!#strings.isEmpty(avatarUrl)}" th:action="@{/profile/avatar}" method="post" style="margin-top:10px;">
            <input type="hidden" name="from" value="account">
            <input type="hidden" name="remove" value="true">
            <button type="submit" class="btn-danger" th:text="#{profile.avatarRemove}">Quitar foto actual</button>
        </form>
    </section>

    <section class="card">
        <h2 style="margin-top:0;" th:text="#{profile.updateUsername}">Actualizar nombre de usuario</h2>
        <form th:action="@{/profile/username}" th:object="${profileForm}" method="post">
            <label for="username" th:text="#{account.username}">Nombre de usuario</label>
            <input id="username" type="text" th:field="*{username}" th:value="${session.username}" required>
            <button type="submit" class="active" th:text="#{common.saveChanges}">Guardar cambios</button>
        </form>
    </section>

    <section class="card">
        <h2 style="margin-top:0;" th:text="#{profile.changePassword}">Cambiar contraseña</h2>
        <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post">
            <label for="currentPassword" th:text="#{account.currentPassword}">Contraseña actual</label>
            <input id="currentPassword" type="password" th:field="*{currentPassword}" placeholder="********" required>

            <label for="newPassword" th:text="#{account.newPassword}">Nueva contraseña</label>
            <input id="newPassword" type="password" th:field="*{newPassword}" required>

            <button type="submit" class="active" th:text="#{profile.updatePasswordButton}">Actualizar contraseña</button>
        </form>
    </section>
</main>
</body>
</html>
