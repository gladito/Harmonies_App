<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Harmony · ${post.title}|">Harmony · Post</title>
    <link rel="stylesheet" th:href="@{/css/harmony.css}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <div class="notice" role="status" th:if="${createSuccess}" th:text="${createSuccess}"></div>
    <div class="notice" role="status" th:if="${postSuccess}" th:text="${postSuccess}"></div>
    <div class="notice" role="status" th:if="${postError}" th:text="${postError}"></div>
    <div class="notice" role="status" th:if="${commentSuccess}" th:text="${commentSuccess}"></div>
    <div class="notice" role="status" th:if="${commentError}" th:text="${commentError}"></div>

    <p><a th:href="@{/home}" th:text="#{common.backToHomeArrow}">← Volver al inicio</a></p>

    <section class="card hero">
        <div class="actions" style="justify-content:space-between;margin-bottom:10px;">
            <div class="actions">
                <a th:href="@{|/people/${post.authorId}|}" class="row-avatar" style="gap:10px;">
                    <img class="avatar-img avatar-sm" style="width:44px;height:44px;min-width:44px;"
                         th:if="${!#strings.isEmpty(post.authorAvatarUrl)}" th:src="${post.authorAvatarUrl}" th:alt="${post.authorUsername}">
                    <span class="avatar avatar-sm" style="width:44px;height:44px;min-width:44px;font-size:18px;"
                          th:if="${#strings.isEmpty(post.authorAvatarUrl)}"
                          th:text="${#strings.substring(post.authorUsername,0,1).toUpperCase()}"></span>
                    <strong th:text="#{post.by(${post.authorUsername})}">Por autor</strong>
                </a>
                <a th:if="${post.bandName != null}" th:href="@{|/bands/${post.bandId}|}" class="pill"
                   th:text="${post.bandName}">Banda</a>
            </div>
            <small class="muted" th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy HH:mm')}">16/11/2026 18:00</small>
        </div>

        <h1 th:text="${post.title}">Título del track</h1>
        <p class="prewrap" style="font-size:16px;color:#e0ddd5;"
           th:text="${!#strings.isEmpty(post.description) ? post.description : #messages.msg('post.noDescription')}"></p>

        <div class="actions" th:if="${post.tags != null and !post.tags.isEmpty()}" style="margin:12px 0;">
            <a class="pill" th:each="label : ${post.tags}" th:href="@{/home(tag=${label})}" th:text="|#${label}|"></a>
        </div>

        <div class="audio-deck">
            <div class="audio-deck-head">
                <strong style="color:var(--gold);letter-spacing:1px;" th:text="#{post.listenDemo}">Escucha la demo:</strong>
                <span class="pill" th:if="${post.durationInSeconds != null}"
                      th:text="#{post.duration(${post.durationInSeconds})}"></span>
            </div>
            <audio controls preload="none" th:src="${post.audioUrl}" th:text="#{audio.unsupported}"></audio>
        </div>

        <div class="actions" style="justify-content:space-between;margin-top:16px;">
            <form th:if="${reaction != null}" class="actions" th:action="@{|/posts/${post.id}/reaction|}" method="post">
                <button name="value" value="1" th:classappend="${reaction.mine == 1} ? 'active'"
                        th:text="#{reaction.likes(${reaction.likes})}"></button>
                <button name="value" value="-1" th:classappend="${reaction.mine == -1} ? 'active'"
                        th:text="#{reaction.dislikes(${reaction.dislikes})}"></button>
                <button th:if="${reaction.mine != 0}" name="value" value="0" th:text="#{reaction.remove}">Retirar</button>
            </form>

            <div th:if="${isOwner}" class="actions">
                <a class="btn" th:href="@{|/posts/${post.id}/edit|}" th:text="#{post.edit}">Editar publicación</a>
                <form th:action="@{|/posts/${post.id}/delete|}" method="post" th:attr="data-confirm=#{post.confirmDelete}">
                    <button type="submit" class="btn-danger" th:text="#{post.delete}">Eliminar publicación</button>
                </form>
            </div>
        </div>
    </section>

    <div class="layout">
        <section>
            <h2 th:text="#{comments.heading}">Comentarios</h2>

            <div th:if="${post.comments == null or post.comments.isEmpty()}" class="card muted"
                 th:text="#{comments.empty}">
                Aún no hay comentarios. Sé el primero en dar feedback.
            </div>

            <div th:if="${post.comments != null and !post.comments.isEmpty()}">
                <article th:each="comment : ${post.comments}" class="comment-card">
                    <div class="comment-head">
                        <a th:href="@{|/people/${comment.author.id}|}" class="row-avatar" style="gap:10px;">
                            <img class="avatar-img avatar-sm"
                                 th:if="${comment.author.profile != null and !#strings.isEmpty(comment.author.profile.avatarUrl)}"
                                 th:src="${comment.author.profile.avatarUrl}" th:alt="${comment.author.username}">
                            <span class="avatar avatar-sm"
                                  th:if="${comment.author.profile == null or #strings.isEmpty(comment.author.profile.avatarUrl)}"
                                  th:text="${#strings.substring(comment.author.username,0,1).toUpperCase()}"></span>
                            <strong th:text="${comment.author.username}">Usuario</strong>
                        </a>
                        <div class="actions" style="gap:10px;">
                            <small class="muted" th:text="${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                            <form th:if="${isOwner}" th:action="@{|/posts/${post.id}/comments/${comment.id}/delete|}" method="post">
                                <button type="submit" class="btn-danger" style="padding:4px 10px;font-size:12px;"
                                        th:text="#{comments.delete}">Eliminar comentario</button>
                            </form>
                        </div>
                    </div>
                    <p class="comment-body" th:text="${comment.content}"></p>
                </article>
            </div>
        </section>

        <aside>
            <div class="card">
                <h2 style="margin-top:0;" th:text="#{comments.add}">Agregar comentario</h2>
                <form th:action="@{|/posts/${post.id}/comments|}" th:object="${commentForm}" method="post">
                    <label for="content" class="small muted" th:text="#{comments.placeholder}">Deja feedback constructivo (máx. 280 caracteres).</label>
                    <textarea id="content" th:field="*{content}" maxlength="280" rows="4"
                              th:placeholder="#{comments.placeholder}" required></textarea>
                    <button type="submit" class="active" style="width:100%;" th:text="#{comments.submit}">Comentar</button>
                </form>
            </div>
        </aside>
    </div>
</main>
</body>
</html>
