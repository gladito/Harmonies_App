<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Harmony | Crear cuenta</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #22d3ee, #6366f1);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
            padding: 36px;
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
        }

        .card h1 {
            margin: 0 0 12px;
            font-size: 26px;
            color: #1f2937;
            text-align: center;
        }

        .card p {
            margin: 0 0 24px;
            color: #4b5563;
            text-align: center;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert.error {
            background-color: rgba(248, 113, 113, 0.15);
            color: #b91c1c;
        }

        form {
            display: grid;
            gap: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.2);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #22d3ee, #6366f1);
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
        }

        .login-link {
            margin-top: 24px;
            text-align: center;
            color: #4b5563;
            font-size: 14px;
        }

        .login-link a {
            color: #6366f1;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Crear cuenta</h1>
    <p>Completa tus datos para unirte a la comunidad Harmony.</p>

    <div th:if="${registerError}" class="alert error" th:text="${registerError}"></div>

    <form th:action="@{/register}" th:object="${registerForm}" method="post">
        <div>
            <label for="firstName">Nombre</label>
            <input id="firstName" type="text" th:field="*{firstName}" placeholder="Tu nombre" required>
        </div>

        <div>
            <label for="lastName">Apellido</label>
            <input id="lastName" type="text" th:field="*{lastName}" placeholder="Tu apellido" required>
        </div>

        <div>
            <label for="birthDate">Fecha de nacimiento</label>
            <input id="birthDate" type="date" th:field="*{birthDate}" required>
        </div>

        <div>
            <label for="username">Nombre de usuario</label>
            <input id="username" type="text" th:field="*{username}" placeholder="Ej: armonico88" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" placeholder="nombre@ejemplo.com" required>
        </div>

        <div>
            <label for="password">Contraseña</label>
            <input id="password" type="password" th:field="*{password}" placeholder="Debe incluir mayúsculas y números" required>
        </div>

        <button type="submit">Crear cuenta</button>
    </form>

    <div class="login-link">
        ¿Ya tienes cuenta?
        <a th:href="@{/login}">Inicia sesión</a>
    </div>
</div>
</body>
</html>
