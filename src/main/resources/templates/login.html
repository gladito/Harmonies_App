<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{account.login}">Harmony | Iniciar sesión</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #22d3ee);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }

        .card h1 {
            margin: 0 0 12px;
            font-size: 28px;
            color: #1f2937;
            text-align: center;
        }

        .card p {
            margin: 0 0 24px;
            color: #4b5563;
            text-align: center;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert.error {
            background-color: rgba(248, 113, 113, 0.15);
            color: #b91c1c;
        }

        .alert.success {
            background-color: rgba(74, 222, 128, 0.15);
            color: #166534;
        }

        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 18px;
            box-sizing: border-box;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        }

        .register-link {
            margin-top: 24px;
            text-align: center;
            color: #4b5563;
            font-size: 14px;
        }

        .register-link a {
            color: #6366f1;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
<style>:root{color-scheme:dark}body{background:#080808!important;color:#f8f8ff!important}h1,h2,h3{color:#d4af37!important}a{color:#d4af37!important}.card,.container,.post-card,.comments-card{border-color:#8b7324!important}button{background:#d4af37!important;color:#080808!important}</style></head>
<body>
<div class="card">
    <h1>Harmony</h1><p th:if="${param.error}" class="alert error" th:text="#{account.invalid}">Email o contraseña incorrectos.</p>
    <p th:text="#{account.loginIntro}">Inicia sesión para seguir creando música con tu equipo.</p>

    <div th:if="${loginError}" class="alert error" th:text="${loginError}"></div>
    <div th:if="${loginSuccess}" class="alert success" th:text="${loginSuccess}"></div>
    <div th:if="${registerSuccess}" class="alert success" th:text="${registerSuccess}"></div>

    <form th:action="@{/login}" th:object="${loginForm}" method="post">
        <label for="email" th:text="#{account.email}">Email</label>
        <input id="email" type="email" th:field="*{email}" placeholder="nombre@ejemplo.com" required>

        <label for="password" th:text="#{account.password}">Contraseña</label>
        <input id="password" type="password" th:field="*{password}" placeholder="********" required>

        <button type="submit" th:text="#{account.login}">Iniciar sesión</button>
    </form>

    <div class="register-link">
        <span th:text="#{login.noAccount}">¿No tienes cuenta?</span>
        <a th:href="@{/register}" th:text="#{login.createOne}">Crea una ahora</a>
        <div style="margin-top:12px;">
            <a th:href="@{/}" th:text="#{index.backToIndex}">← Volver a la portada</a>
        </div>
    </div>
</div>
</body>
</html>
