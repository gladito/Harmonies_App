<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{post.createTitle}">Harmony · Nueva publicación</title>
    <link rel="stylesheet" th:href="@{/css/harmony.css}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main style="max-width:680px;">
    <div class="notice" role="alert" th:if="${createError}" th:text="${createError}"></div>

    <section class="card hero">
        <span class="eyebrow" th:text="#{home.eyebrow}">La música empieza con una conexión</span>
        <h1 th:text="#{post.createHeading}">Nueva publicación</h1>
        <p class="muted" th:text="#{post.createSubtitle}">Comparte tu último audio con la comunidad y recibe feedback de tus bandas.</p>
    </section>

    <section class="card">
        <form th:action="@{/posts}" th:object="${postForm}" method="post">
            <label for="title" th:text="#{band.title}">Título</label>
            <input id="title" type="text" th:field="*{title}" maxlength="120" placeholder="Ej. Synthwave Jam #3" required>

            <label for="tags" th:text="#{tags.help}">Etiquetas (hasta cinco, separadas por coma)</label>
            <input id="tags" th:field="*{tags}" maxlength="254" placeholder="jazz, bajo, colaboración">

            <label for="description" th:text="#{band.description}">Descripción</label>
            <textarea id="description" th:field="*{description}" maxlength="500"></textarea>

            <label for="audioUrl" th:text="#{post.audioUrl}">URL del audio</label>
            <input id="audioUrl" type="text" th:field="*{audioUrl}" placeholder="https://..." required>

            <label for="durationInSeconds" th:text="#{post.durationSeconds}">Duración (segundos)</label>
            <input id="durationInSeconds" type="number" th:field="*{durationInSeconds}" min="0" placeholder="180">

            <label for="visibility" th:text="#{post.visibility}">Visibilidad</label>
            <select id="visibility" th:field="*{visibility}">
                <option th:value="${T(com.example.demo.Models.Visibility).PUBLIC}" th:text="#{visibility.public}">Público</option>
                <option th:value="${T(com.example.demo.Models.Visibility).PRIVATE}" th:text="#{visibility.private}">Privado</option>
            </select>

            <div class="actions" style="justify-content:space-between;margin-top:10px;">
                <a class="btn" th:href="@{/home}" th:text="#{common.backToHome}">Volver al inicio</a>
                <button type="submit" class="active" th:text="#{post.publishButton}">Publicar</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
