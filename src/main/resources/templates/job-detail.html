<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Harmony · ${job.title}|">Harmony · Aviso</title>
    <link rel="stylesheet" th:href="@{/css/harmony.css}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <div class="notice" role="status" th:if="${message}" th:text="${message}"></div>
    <div class="notice" role="status" th:if="${success}" th:text="#{jobs.published}">Aviso publicado.</div>
    <div class="notice" role="status" th:if="${applied}" th:text="#{application.sent}">¡Postulación enviada!</div>

    <p><a th:href="@{/jobs}" th:text="#{jobs.back}">← Volver a la bolsa de trabajo</a></p>

    <section class="card hero">
        <div class="actions">
            <span class="pill" th:text="#{${'job.type.' + job.type}}"></span>
            <span class="pill" th:if="${job.instrument}" th:text="${job.instrument}"></span>
            <span class="pill" th:if="${job.remote}" th:text="#{job.remote}">Remoto</span>
            <span class="status" th:classappend="${job.open} ? 'status-confirmed' : 'status-cancelled'" th:text="${job.open} ? #{job.open} : #{job.closed}"></span>
        </div>
        <h1 th:text="${job.title}"></h1>
        <p class="price big" th:text="${job.pay}"></p>
        <p class="muted" th:text="${job.location}"></p>
        <p class="small">
            <span th:text="#{job.publishedBy}">Publicado por</span>
            <a th:href="@{|/people/${job.author.id}|}" th:text="${job.author.username}"></a> ·
            <span th:text="${#temporals.format(job.createdAt,'dd/MM/yyyy')}"></span>
        </p>
    </section>

    <div class="layout">
        <section>
            <div class="card" th:if="${job.description}"><p class="prewrap" th:text="${job.description}"></p></div>

            <div class="card" th:if="${isAuthor}">
                <h2 th:text="#{application.received}">Postulaciones recibidas</h2>
                <p class="muted" th:if="${#lists.isEmpty(applications)}" th:text="#{application.none}">Todavía nadie se postuló.</p>
                <div class="member" th:each="a : ${applications}">
                    <div class="actions" style="gap:8px">
                        <a th:href="@{|/people/${a.applicant.id}|}" th:text="${a.applicant.username}"></a>
                        <span class="status" th:classappend="|status-${#strings.toLowerCase(a.status)}|" th:text="#{${'application.status.' + a.status}}"></span>
                        <span class="status" th:if="${appPayments[a.id] != null}"
                              th:classappend="${appPayments[a.id].status.name() == 'PAID'} ? 'status-confirmed' : 'status-pending'"
                              th:text="#{${'payment.status.' + appPayments[a.id].status}}"></span>
                    </div>
                    <p class="small" th:text="${a.message} ?: #{application.noMessage}"></p>

                    <div class="actions" th:if="${a.status.name() == 'PENDING'}">
                        <form th:action="@{|/jobs/${job.id}/applications/${a.id}|}" method="post">
                            <input type="hidden" name="accept" value="true"><button class="active" th:text="#{application.accept}">Aceptar</button>
                        </form>
                        <form th:action="@{|/jobs/${job.id}/applications/${a.id}|}" method="post">
                            <input type="hidden" name="accept" value="false"><button class="btn-danger" th:text="#{application.reject}">Rechazar</button>
                        </form>
                    </div>

                    <div class="card" style="margin-top:12px;background:#0d0d0d"
                         th:if="${appPayments[a.id] != null and appPayments[a.id].status.name() == 'PENDING_PAYMENT'}">
                        <h3 style="margin:0 0 8px;font-size:16px" th:text="#{payments.contractPayHeading}">Pago de la contratación</h3>
                        <form th:action="@{|/payments/${appPayments[a.id].id}/pay|}" method="post">
                            <input type="hidden" name="back" th:value="|/jobs/${job.id}|">
                            <label th:text="#{payments.amountLabel}">Monto a abonar ($)</label>
                            <input type="number" name="amount" min="100" max="10000000" required th:value="${appPayments[a.id].amount}">
                            <label th:text="#{payments.methodLabel}">Método de pago</label>
                            <select name="paymentMethod">
                                <option th:each="m : ${methods}" th:value="${m}"
                                        th:selected="${appPayments[a.id].paymentMethod == m}"
                                        th:text="#{${'payment.method.' + m}}"></option>
                            </select>

                            <div class="pay-transfer-fields" th:style="${appPayments[a.id].paymentMethod.name() == 'CARD'} ? 'display:none' : 'display:block'">
                                <div class="member-section" style="margin-bottom:10px;font-size:13px;">
                                    <div><strong style="color:var(--gold);" th:text="#{payments.destAlias}">Alias de destino:</strong>
                                        <code th:text="|${a.applicant.username}.harmony.mp|"></code></div>
                                    <div><strong style="color:var(--gold);" th:text="#{payments.destCbu}">CBU / CVU:</strong>
                                        <code th:text="|0000003100084920155${a.applicant.id}|"></code></div>
                                </div>
                                <label th:text="#{payments.operationRefLabel}">N° de operación / comprobante de la transferencia</label>
                                <input type="text" name="operationReference" maxlength="50"
                                       th:required="${appPayments[a.id].paymentMethod.name() != 'CARD'}"
                                       th:placeholder="#{payments.operationRefPlaceholder}">
                            </div>

                            <div class="pay-card-fields" th:style="${appPayments[a.id].paymentMethod.name() == 'CARD'} ? 'display:block' : 'display:none'">
                                <label th:text="#{payments.cardHolderLabel}">Nombre y apellido del titular de la tarjeta</label>
                                <input type="text" name="cardHolder" maxlength="60"
                                       th:required="${appPayments[a.id].paymentMethod.name() == 'CARD'}"
                                       th:placeholder="#{payments.cardHolderPlaceholder}">
                                <label th:text="#{payments.cardNumberLabel}">Número de tarjeta (16 dígitos o últimos 4)</label>
                                <input type="text" name="cardNumber" maxlength="24"
                                       th:required="${appPayments[a.id].paymentMethod.name() == 'CARD'}"
                                       th:placeholder="#{payments.cardNumberPlaceholder}">
                            </div>

                            <button type="submit" class="active" th:text="#{payments.registerPaymentBtn}">Registrar pago y guardar comprobante</button>
                        </form>
                        <form th:action="@{|/jobs/${job.id}/applications/${a.id}/cancel|}" method="post" style="margin-top:8px">
                            <button type="submit" th:text="#{application.cancelAcceptance}">Cancelar contratación</button>
                        </form>
                    </div>

                    <p class="small muted" th:if="${appPayments[a.id] != null and appPayments[a.id].status.name() == 'PAID'}">
                        <span th:text="#{${'payment.method.' + appPayments[a.id].paymentMethod}}"></span> ·
                        <strong th:text="|$ ${#numbers.formatInteger(appPayments[a.id].amount,1,'POINT')}|"></strong> ·
                        <span th:text="|#{payments.receipt} ${appPayments[a.id].receiptCode}|"></span>
                    </p>
                </div>
            </div>
        </section>

        <aside>
            <div class="card" th:if="${!isAuthor and mine == null and job.open}">
                <h2 th:text="#{application.title}">Postularme</h2>
                <form th:action="@{|/jobs/${job.id}/apply|}" method="post">
                    <label for="message" th:text="#{application.message}">Mensaje para quien publicó</label>
                    <textarea id="message" name="message" maxlength="500" th:placeholder="#{application.placeholder}"></textarea>
                    <button class="active" th:text="#{application.submit}">Enviar postulación</button>
                </form>
            </div>

            <div class="card" th:if="${mine != null}">
                <h2 th:text="#{application.yours}">Tu postulación</h2>
                <div class="actions" style="gap:8px;margin-bottom:8px">
                    <span class="status" th:classappend="|status-${#strings.toLowerCase(mine.status)}|" th:text="#{${'application.status.' + mine.status}}"></span>
                    <span class="status" th:if="${myPayment != null}"
                          th:classappend="${myPayment.status.name() == 'PAID'} ? 'status-confirmed' : 'status-pending'"
                          th:text="#{${'payment.status.' + myPayment.status}}"></span>
                </div>
                <p class="small" th:text="${mine.message} ?: #{application.noMessage}"></p>
                <p class="small muted" th:if="${myPayment != null and myPayment.receiptCode != null}">
                    <strong th:text="|$ ${#numbers.formatInteger(myPayment.amount,1,'POINT')}|"></strong> ·
                    <span th:text="#{${'payment.method.' + myPayment.paymentMethod}}"></span> ·
                    <span th:text="|#{payments.receipt} ${myPayment.receiptCode}|"></span>
                </p>
            </div>

            <div class="card" th:if="${isAuthor}">
                <h2 th:text="#{job.manage}">Administrar aviso</h2>
                <form th:action="@{|/jobs/${job.id}/open|}" method="post">
                    <input type="hidden" name="open" th:value="${!job.open}">
                    <button th:text="${job.open} ? #{job.close} : #{job.reopen}"></button>
                </form>
            </div>
        </aside>
    </div>
</main>
</body>
</html>
